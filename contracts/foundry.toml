[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
ink = "https://rpc-gel.inkonchain.com"
ink_sepolia = "https://rpc-gel-sepolia.inkonchain.com"

[etherscan]
ink = { key = "verifyContract", url = "https://explorer.inkonchain.com/api", chain = 57073 }
ink_sepolia = { key = "verifyContract", url = "https://explorer-sepolia.inkonchain.com/api", chain = 763373 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
